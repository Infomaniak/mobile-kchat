---
name: recover-sentry-maps

# Manual recovery after a Sentry outage during a release: rebuilds the tag and re-runs
# only the Sentry uploads (Android JS bundle map via gradle, iOS JS map + dSYMs via the
# Xcode phases). No store contact by design: no fastlane deploy step exists here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to recover (ex: 1.0.48-beta.27.android)'
        required: true

env:
  NODE_VERSION: 22.14.0
  TERM: xterm

jobs:
  android:
    if: ${{ endsWith(inputs.tag, '.android') }}
    runs-on: [self-hosted, macOS, Android]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - name: ci/check-recoverable-tag
        run: |
          if ! echo "${{ inputs.tag }}" | grep -Eq -- '-(beta|alpha)\.[0-9]+\.android$'; then
            echo "::error::Only beta/alpha tags are supported for now, store tags need !435"
            exit 1
          fi

      - name: ci/compute-android-version
        id: version
        uses: ./.github/actions/compute-android-version
        with:
          tag: ${{ inputs.tag }}

      - name: ci/prepare-android-build
        uses: ./.github/actions/prepare-android-build
        env:
          STORE_FILE: "${{ secrets.MM_MOBILE_STORE_FILE }}"
          STORE_ALIAS: "${{ secrets.MM_MOBILE_STORE_ALIAS }}"
          STORE_PASSWORD: "${{ secrets.MM_MOBILE_STORE_PASSWORD }}"
          MATTERMOST_BUILD_GH_TOKEN: "${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}"

      - name: ci/update-android-version
        working-directory: ./fastlane
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NUMBER: ${{ steps.version.outputs.version-name }}
        run: |
          echo "Recomputing Android versionCode $ANDROID_VERSION_CODE / versionName $VERSION_NUMBER"
          bundle exec fastlane set_android_version_from_env

      - name: ci/rebuild-and-upload-sentry-maps
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_BETA_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_BETA_AWS_SECRET_ACCESS_KEY }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_BETA_MATTERMOST_WEBHOOK_URL }}"
          SENTRY_AUTH_TOKEN: "${{ secrets.MM_MOBILE_SENTRY_AUTH_TOKEN }}"
          SENTRY_DSN_ANDROID: ${{ secrets.MM_MOBILE_BETA_SENTRY_DSN_ANDROID }}
        working-directory: ./fastlane
        run: |
          echo "::group::Rebuild and upload Sentry maps (no store upload)"
          bundle exec fastlane android build --env android.beta
          echo "::endgroup::"

  ios:
    if: ${{ endsWith(inputs.tag, '.ios') }}
    runs-on: [self-hosted, macOS, iOS]
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - name: ci/output-ssh-private-key
        shell: bash
        run: |
          SSH_KEY_PATH=~/.ssh/id_ed25519
          mkdir -p ~/.ssh
          echo -e '${{ secrets.MM_MOBILE_PRIVATE_DEPLOY_KEY }}' > ${SSH_KEY_PATH}
          chmod 0600 ${SSH_KEY_PATH}
          ssh-keygen -y -f ${SSH_KEY_PATH} > ${SSH_KEY_PATH}.pub

      - name: ci/prepare-ios-build
        uses: ./.github/actions/prepare-ios-build
        env:
          MATTERMOST_BUILD_GH_TOKEN: "${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}"

      - name: ci/compute-ios-version
        id: version
        uses: ./.github/actions/compute-ios-version
        with:
          tag: ${{ inputs.tag }}

      - name: ci/update-ios-version
        working-directory: ./fastlane
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.version-number }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          echo "Recomputing iOS versionNumber $VERSION_NUMBER / buildNumber $BUILD_NUMBER"
          bundle exec fastlane ios set_ios_version_from_env

      - name: ci/rebuild-and-upload-sentry-maps
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_BETA_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_BETA_AWS_SECRET_ACCESS_KEY }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_BETA_MATTERMOST_WEBHOOK_URL }}"
          SENTRY_AUTH_TOKEN: "${{ secrets.MM_MOBILE_SENTRY_AUTH_TOKEN }}"
          SENTRY_DSN_IOS: "${{ secrets.MM_MOBILE_BETA_SENTRY_DSN_IOS }}"
          FASTLANE_TEAM_ID: "${{ secrets.MM_MOBILE_FASTLANE_TEAM_ID }}"
          IOS_API_ISSUER_ID: "${{ secrets.MM_MOBILE_IOS_API_ISSUER_ID }}"
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
          IOS_API_KEY_ID: "${{ secrets.MM_MOBILE_IOS_API_KEY_ID }}"
          MATCH_GIT_URL: "${{ secrets.MM_MOBILE_MATCH_GIT_URL }}"
          MATCH_PASSWORD: "${{ secrets.MM_MOBILE_MATCH_PASSWORD }}"
        working-directory: ./fastlane
        run: |
          echo "::group::Rebuild and upload Sentry maps (no TestFlight upload)"
          bundle exec fastlane ios build --env ios.beta
          echo "::endgroup::"
