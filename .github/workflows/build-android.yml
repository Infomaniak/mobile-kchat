---
name: build-android

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+.android'

env:
  NODE_VERSION: 22.14.0
  TERM: xterm

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      track: ${{ steps.env.outputs.track }}
    steps:
      - name: ci/determine-environment
        id: env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ -rc\. ]]; then
            echo "environment=rc" >> "$GITHUB_OUTPUT"
            echo "track=internal" >> "$GITHUB_OUTPUT"
          fi
  test:
    runs-on: [self-hosted, macOS, Android]
    needs: determine-environment
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/test
        uses: ./.github/actions/test

  build-and-deploy:
    runs-on: [self-hosted, macOS, Android]
    needs:
      - determine-environment
      - test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ci/compute-android-version
        id: version
        uses: ./.github/actions/compute-android-version

      - name: ci/prepare-android-build
        uses: ./.github/actions/prepare-android-build
        env:
          STORE_FILE: "${{ secrets.MM_MOBILE_STORE_FILE }}"
          STORE_ALIAS: "${{ secrets.MM_MOBILE_STORE_ALIAS }}"
          STORE_PASSWORD: "${{ secrets.MM_MOBILE_STORE_PASSWORD }}"
          MATTERMOST_BUILD_GH_TOKEN: "${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}"

      - name: ci/update-android-version
        working-directory: ./fastlane
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NUMBER: ${{ steps.version.outputs.version-name }}
        run: |
          echo "Setting Android versionCode to $ANDROID_VERSION_CODE"
          echo "Setting Android versionName to $VERSION_NUMBER"
          bundle exec fastlane set_android_version_from_env

      - name: ci/build-and-deploy-android
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_BETA_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_BETA_AWS_SECRET_ACCESS_KEY }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_BETA_MATTERMOST_WEBHOOK_URL }}"
          SENTRY_AUTH_TOKEN: "${{ secrets.MM_MOBILE_SENTRY_AUTH_TOKEN }}"
          SENTRY_DSN_ANDROID: ${{ secrets.MM_MOBILE_BETA_SENTRY_DSN_ANDROID }}
          SUPPLY_JSON_KEY: ${{ github.workspace }}/mobile-private/android/kchat-credentials.json
          SUPPLY_TRACK: ${{ needs.determine-environment.outputs.track }}
        run: |
          echo "::group::Build"
          bundle exec fastlane android build --env android.${{ needs.determine-environment.outputs.environment }}
          echo "::endgroup::"
          echo "::group::Deploy to Play Store (${{ needs.determine-environment.outputs.track }})"
          bundle exec fastlane android deploy file:"${{ github.workspace }}/*.aab" --env android.${{ needs.determine-environment.outputs.environment }}
          echo "::endgroup::"
        working-directory: ./fastlane

      - name: ci/sentry-maps-check
        # Read-only diagnostic, fail-open by design: this check never fails the build. Sourcemaps are
        # uploaded by debug ID into artifact bundles, invisible to `sentry-cli releases files`
        # (subcommand removed in sentry-cli 2.42.4), so the artifact-bundles API is queried instead.
        # Parity with webapp (release:sentry) and desktop (sentry-maps-check): warn and notify kChat
        # when the release ends up with 0 sourcemap bundles. The release name matches the default
        # naming of @sentry/react-native sentry.gradle: <applicationId>@<versionName>+<versionCode>.
        # Skipped if the version could not be computed (earlier step failed), to avoid querying for
        # a mangled release name.
        if: ${{ !cancelled() && steps.version.outputs.version-code != '' && steps.version.outputs.version-name != '' }}
        env:
          SENTRY_URL: https://sentry-kchat.infomaniak.com
          SENTRY_ORG: sentry
          SENTRY_PROJECT: mobile
          SENTRY_RELEASE: "com.infomaniak.chat@${{ steps.version.outputs.version-name }}+${{ steps.version.outputs.version-code }}"
          SENTRY_AUTH_TOKEN: ${{ secrets.MM_MOBILE_SENTRY_AUTH_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.KCHAT_SENTRY_WEBHOOK_URL }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::MM_MOBILE_SENTRY_AUTH_TOKEN secret not set, Sentry maps check skipped"
            exit 0
          fi
          if ! curl -sf --connect-timeout 10 --max-time 30 --get "${SENTRY_URL%/}/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/files/artifact-bundles/" \
                  --data-urlencode "query=$SENTRY_RELEASE" \
                  -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" > /tmp/sentry-bundles.json 2>/tmp/sentry-bundles-error.txt; then
            cat /tmp/sentry-bundles-error.txt
            echo "::notice::sentry artifact-bundles list unavailable (API down or token may not cover it), skipping maps check"
            exit 0
          fi
          COUNT=$(python3 -c "import json,os; data=json.load(open('/tmp/sentry-bundles.json')); release=os.environ['SENTRY_RELEASE']; print(sum(1 for b in data if b.get('fileCount',0)>0 and any(a.get('release')==release for a in (b.get('associations') or []))))" 2>/dev/null) || { echo "::notice::could not parse the artifact-bundles response, skipping maps check"; exit 0; }
          if [ -z "$COUNT" ]; then
            echo "::notice::could not parse the artifact-bundles response, skipping maps check"
            exit 0
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::Sentry release $SENTRY_RELEASE has no sourcemaps, the upload may have failed silently (check build logs for [sentry] warnings)"
            if [ -n "$MATTERMOST_WEBHOOK_URL" ]; then
              TEXT="[$GITHUB_REF_NAME] Warning: Sentry release $SENTRY_RELEASE has no sourcemaps, the upload may have failed silently."
              printf '{"username":"MobileReleaseBot","icon_url":"https://infomaniak.kchat.infomaniak.com/static/emoji/kchat.png","text":"%s"}' "$TEXT" > /tmp/sentry-maps-notify.json
              curl -sf --connect-timeout 10 --max-time 30 -H "Content-Type: application/json" -X POST -d @/tmp/sentry-maps-notify.json "$MATTERMOST_WEBHOOK_URL" \
                || echo "::warning::kChat notification failed (check KCHAT_SENTRY_WEBHOOK_URL secret), message was: $TEXT"
            else
              echo "::notice::KCHAT_SENTRY_WEBHOOK_URL secret not set, kChat notification skipped"
            fi
          else
            echo "OK: $COUNT sourcemap bundle(s) found on release $SENTRY_RELEASE"
          fi

      - name: ci/upload-android-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-${{ needs.determine-environment.outputs.environment }}-${{ github.run_id }}
          path: "*.apk"

  sentry-resolve:
    # Gate sur le build : jamais d'ancre/Redmine si l'upload a echoue.
    needs:
      - build-and-deploy
    uses: ./.github/workflows/sentry-resolve.yaml
    secrets: inherit
