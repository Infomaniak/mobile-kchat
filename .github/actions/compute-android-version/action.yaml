name: compute-android-version
description: Computes Android versionCode from Git tag (format X.Y.Z-alpha.N.android, X.Y.Z-beta.N.android or X.Y.Z.android)

inputs:
  tag:
    description: The Git tag to parse
    required: true
    default: ${{ github.ref_name }}

outputs:
  version-code:
    description: The computed Android versionCode (format 1_00_046_004)
    value: ${{ steps.compute.outputs.version-code }}
  version-name:
    description: The version name extracted from the tag
    value: ${{ steps.compute.outputs.version-name }}

runs:
  using: composite
  steps:
    - name: ci/compute-android-version
      id: compute
      shell: bash
      run: |
        TAG="${{ inputs.tag }}"
        echo "Parsing tag: $TAG"

        emit_version_code() {
          local major="$1" minor="$2" patch="$3" candidate="$4" detail="$5"
          # versionCode = major + 2-digit minor + 3-digit patch + 3-digit candidate
          local version_code="${major}$(printf '%02d' "$minor")$(printf '%03d' "$patch")$(printf '%03d' "$candidate")"
          local display_code="${major}_$(printf '%02d' "$minor")_$(printf '%03d' "$patch")_$(printf '%03d' "$candidate")"
          [[ "$version_code" -gt 2100000000 ]] && { echo "❌ versionCode $version_code exceeds the Play limit (2100000000): major must stay <= 20"; exit 1; }
          [[ -n "$detail" ]] && display_code="$display_code, $detail"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version-name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "✅ Computed versionCode: $version_code (readable: $display_code)"
          echo "✅ Computed versionName: ${major}.${minor}.${patch}"
        }

        if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-(alpha|beta)\.([0-9]+)\.android$ ]]; then
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          CANDIDATE="${BASH_REMATCH[5]}"

          emit_version_code "$MAJOR" "$MINOR" "$PATCH" "$CANDIDATE"
        elif [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.android$ ]]; then
          # Store build: continue the versionCode numbering after the highest alpha/beta tag of this version
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          LAST=$(git tag --list "${MAJOR}.${MINOR}.${PATCH}-*.*.android" | sed -En 's/.*-(alpha|beta)\.([0-9]+)\.android$/\2/p' | sort -n | tail -1)
          CANDIDATE=$(( ${LAST:-0} + 1 ))
          # A later alpha.N or beta.N tag with this N would collide in Play: cut remaining candidates before the store tag
          echo "⚠️ Store build takes candidate $CANDIDATE: tag any remaining ${MAJOR}.${MINOR}.${PATCH}-alpha.N.android or -beta.N.android BEFORE this tag, or use a higher N"

          emit_version_code "$MAJOR" "$MINOR" "$PATCH" "$CANDIDATE" "next after ${LAST:-none}"
        else
          echo "❌ Error: Tag format invalid. Expected: X.Y.Z-alpha.N.android, X.Y.Z-beta.N.android or X.Y.Z.android"
          echo "   Got: $TAG"
          exit 1
        fi
