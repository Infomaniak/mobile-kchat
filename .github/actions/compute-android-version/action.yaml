name: compute-android-version
description: Computes Android versionCode from Git tag (format X.Y.Z-alpha.N.android, X.Y.Z-beta.N.android or X.Y.Z.android)

inputs:
  tag:
    description: The Git tag to parse
    required: true
    default: ${{ github.ref_name }}

outputs:
  version-code:
    description: The computed Android versionCode (format 1_00_046_004)
    value: ${{ steps.compute.outputs.version-code }}
  version-name:
    description: The version name extracted from the tag
    value: ${{ steps.compute.outputs.version-name }}

runs:
  using: composite
  steps:
    - name: ci/compute-android-version
      id: compute
      shell: bash
      run: |
        TAG="${{ inputs.tag }}"
        echo "Parsing tag: $TAG"

        # Extract version parts from tag (e.g., 1.0.46-alpha.1.android or 1.0.46-beta.1.android)
        if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-(alpha|beta)\.([0-9]+)\.android$ ]]; then
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          CANDIDATE="${BASH_REMATCH[5]}"

          # Format: 100046001 (Android requires pure integer)
          # For display: 1_00_046_001 (Major: 1, Minor: 2 digits, Patch: 3 digits, Candidate: 3 digits)
          VERSION_CODE="${MAJOR}$(printf '%02d' "$MINOR")$(printf '%03d' "$PATCH")$(printf '%03d' "$CANDIDATE")"
          DISPLAY_VERSION_CODE="${MAJOR}_$(printf '%02d' "$MINOR")_$(printf '%03d' "$PATCH")_$(printf '%03d' "$CANDIDATE")"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          [[ "$VERSION_CODE" -gt 2100000000 ]] && { echo "❌ versionCode $VERSION_CODE exceeds the Play limit (2100000000): major must stay <= 20"; exit 1; }

          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Computed versionCode: $VERSION_CODE (readable: $DISPLAY_VERSION_CODE)"
          echo "✅ Computed versionName: $VERSION_NAME"
        elif [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\.android$ ]]; then
          # Store build: continue the versionCode numbering after the highest alpha/beta tag of this version
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          LAST=$(git tag --list "${MAJOR}.${MINOR}.${PATCH}-*.*.android" | sed -En 's/.*-(alpha|beta)\.([0-9]+)\.android$/\2/p' | sort -n | tail -1)
          CANDIDATE=$(( ${LAST:-0} + 1 ))
          # A later beta.N tag with this N would collide in Play: cut remaining betas before the store tag
          echo "⚠️ Store build takes candidate $CANDIDATE: tag any remaining ${MAJOR}.${MINOR}.${PATCH}-beta.N.android BEFORE this tag, or use a higher N"

          # Format: 100046001 (Android requires pure integer)
          # For display: 1_00_046_001 (Major: 1, Minor: 2 digits, Patch: 3 digits, Candidate: 3 digits)
          VERSION_CODE="${MAJOR}$(printf '%02d' "$MINOR")$(printf '%03d' "$PATCH")$(printf '%03d' "$CANDIDATE")"
          DISPLAY_VERSION_CODE="${MAJOR}_$(printf '%02d' "$MINOR")_$(printf '%03d' "$PATCH")_$(printf '%03d' "$CANDIDATE")"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          [[ "$VERSION_CODE" -gt 2100000000 ]] && { echo "❌ versionCode $VERSION_CODE exceeds the Play limit (2100000000): major must stay <= 20"; exit 1; }

          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Computed versionCode: $VERSION_CODE (readable: $DISPLAY_VERSION_CODE, next after ${LAST:-none})"
          echo "✅ Computed versionName: $VERSION_NAME"
        else
          echo "❌ Error: Tag format invalid. Expected: X.Y.Z-alpha.N.android, X.Y.Z-beta.N.android or X.Y.Z.android"
          echo "   Got: $TAG"
          exit 1
        fi
