include:
  - component: $CI_SERVER_FQDN/devops/ci/components/sbom/run@1.9.3
    inputs:
      stage: .post
      sbom_dependency_track_project: ksuite-kchat/kchat-mobile
      sbom_do_image: false
      sbom_do_repository: true
      rules:
        - if: $CI_COMMIT_TAG
          allow_failure: false
          when: on_success
        - when: never

stages:
  - install
  - check
  - test-unit

default:
  interruptible: true

variables:
  NODE_VERSION: 22.14.0

.rule-mr: &rule-mr
  - if: &if-merge-request "$CI_MERGE_REQUEST_ID"
    when: on_success

.npm-cache: &npm-cache
  key:
    prefix: npm
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

.tests-node: &tests-node
  image: node:${NODE_VERSION}
  tags: [shared, standard]
  cache:
    <<: *npm-cache
    policy: pull

install:
  stage: install
  image: node:${NODE_VERSION}
  tags: [shared, standard]
  rules:
    - *rule-mr
    - when: never
  cache:
    <<: *npm-cache
    policy: pull-push
  script:
    - |
      if [ -f node_modules/.package-lock.json ] && diff -q node_modules/.package-lock.json package-lock.json > /dev/null 2>&1; then
        echo "Cache hit — node_modules matches package-lock.json, skipping npm ci"
      else
        npm ci --ignore-scripts
        node node_modules/@sentry/cli/scripts/install.js
        npx patch-package
      fi
    - node scripts/generate-assets.js
    - node scripts/jitsi-ts-nocheck.js
  artifacts:
    expire_in: 12h
    paths:
      - dist/assets/

test:check:
  stage: check
  extends:
    - .tests-node
  needs: ["install"]
  rules:
    - *rule-mr
    - when: never
  script:
    - npm run check

test:i18n:
  stage: check
  extends:
    - .tests-node
  needs: ["install"]
  rules:
    - *rule-mr
    - when: never
  script:
    - ./scripts/precommit/i18n.sh

test:unit-tests:
  stage: test-unit
  extends: [.tests-node]
  needs: ["install"]
  rules:
    - *rule-mr
    - when: never
  script:
    - mkdir -p reports
    - npm run test:ci -- --testResultsProcessor=jest-junit
  artifacts:
    expire_in: 7 days
    reports:
      junit: reports/junit-jest.xml

code_quality:
  stage: test-unit
  extends: [.tests-node]
  needs: ["install"]
  allow_failure: true
  rules:
    - *rule-mr
    - when: never
  script:
    - mkdir -p reports
    - npm run lint -- --format gitlab
  artifacts:
    expire_in: 7 days
    reports:
      codequality: gl-code-quality-report.json
